services:
  common:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - common-data:/app/instance
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1
    networks:
      - classroom
volumes:
  common-data:
networks:
  classroom:
    internal: true
