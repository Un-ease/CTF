services:
  common:
    build: .
    volumes:
      - common-data:/app/instance
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1
    networks:
      - classroom
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  lab-proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      common:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LAB_PORT:-15000}:8080"
    volumes:
      - ./deploy/lab-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    networks:
      - classroom
      - lab-ingress

volumes:
  common-data:
networks:
  classroom:
    internal: true
  lab-ingress:
    driver: bridge
